name: Release

on:
  push:
    branches: [main]

# One release train at a time; queued pushes fold into the next run.
concurrency: release-${{ github.ref }}

permissions:
  contents: write # version-PR branch, tags, GitHub releases
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # npm Trusted Publishing (OIDC) + provenance

# While unreleased changesets exist on main, this maintains a "Version
# Packages" PR (version bump + CHANGELOG). Merging that PR re-triggers the
# workflow with no pending changesets, which runs `pnpm release` and publishes
# to npm via TRUSTED PUBLISHING: no npm token anywhere — npm exchanges this
# job's GitHub OIDC identity (org/repo/workflow/environment must match the
# trusted publisher configured on npmjs.com for the package) for a short-lived
# credential, and generates provenance automatically.
# Org policy: every action pinned to a full-length commit SHA (`# vN`
# comments are what Dependabot updates).
jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: npm install -g corepack && corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing requires a recent npm (OIDC credential exchange).
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      # changesets/action expects npm auth to exist; with trusted publishing
      # there is none. A bare user .npmrc satisfies its presence check without
      # injecting any credential (npm then falls through to OIDC).
      - run: |
          [ -f "$HOME/.npmrc" ] || echo "registry=https://registry.npmjs.org/" > "$HOME/.npmrc"
      - uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          publish: pnpm release
          title: 'chore: version package'
          commit: 'chore: version package'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
