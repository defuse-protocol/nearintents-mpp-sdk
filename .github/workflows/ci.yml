name: CI

on:
  push:
    branches: [main]
  pull_request:

# defuse-protocol org policy: every action MUST be pinned to a full-length
# commit SHA (tag refs are rejected at "Set up job"). Keep the `# vN` comments
# — Dependabot uses them to propose SHA updates. pnpm comes from corepack +
# the packageManager pin, keeping the action surface first-party only.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: npm install -g corepack && corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:types
      - run: pnpm lint
      # Mock-only test suite — must never call live 1Click.
      - run: pnpm test

  # Early warning for mppx pre-1.0 churn: run the suite against mppx@latest.
  # Allowed to fail — breakage here means "prepare a compat release", not "block CI".
  mppx-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: npm install -g corepack && corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # -w: this intentionally targets the workspace root package.
      - run: pnpm add -D -w mppx@latest
      - run: pnpm check:types || true
      - run: pnpm test
